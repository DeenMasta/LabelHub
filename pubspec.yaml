name: labelhub
description: "Offline barcode-label import, design and printing application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^11.0.3
  csv: ^8.0.0
  barcode: ^2.2.9
  permission_handler: ^12.0.1
  uuid: ^4.6.0
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Generate Android launcher assets with:
# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  image_path: assets/icon/app_icon.png
